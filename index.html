<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>냥냥 서바이벌</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <!-- [웹 빌드 화면 맞춤, 2026-11-24] 게임 화면이 브라우저 창 크기를 따라가도록 만든 템플릿 -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-fullscreen-button" title="전체 화면"></div>
      <div id="unity-perf-notice">
        브라우저의 그래픽 가속이 꺼져 있어 게임이 느릴 수 있어요.<br>
        크롬: 설정 → 시스템 → <b>"가능한 경우 그래픽 가속 사용"</b>을 켜고 크롬을 다시 시작해 주세요.
        <span id="unity-perf-notice-close" title="닫기">✕</span>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // [화면 비율 고정, 2026-11-24] 사용자 요청 - 창 비율이 16:9가 아니면(예: 4:3에 가까운 창) 타이틀 그림
      // 좌우와 UI가 잘렸다. 게임 화면을 항상 16:9(전체화면과 같은 구도)로 유지하고 남는 곳은 검은 여백.
      var MIN_ASPECT = 16 / 9, MAX_ASPECT = 16 / 9;
      // [웹 렉 개선, 2026-11-24] 창을 꽉 채우면서 실제로 그리는 해상도까지 창 크기 x 화면 배율로 커져
      // 렉이 심해졌다. 보이는 크기는 창에 맞추되, 내부 렌더링 해상도는 가로 MAX_RENDER_WIDTH로 제한하고
      // 브라우저가 늘려서 보여준다(화면 배율 devicePixelRatio도 무시).
      var MAX_RENDER_WIDTH = 1280;

      // [웹 최적화, 2026-11-24] 크롬 하드웨어 가속이 꺼져 있거나 GPU가 차단되면 WebGL을 CPU로 그린다
      // (소프트웨어 렌더링 - 엣지는 정상인데 크롬만 렉이 심했던 원인). 이때는 해상도를 더 낮추고 안내를 띄운다.
      function detectSoftwareRendering() {
        try {
          var test = document.createElement("canvas");
          var strict = test.getContext("webgl2", { failIfMajorPerformanceCaveat: true });
          if (!strict) return true;
          var ext = strict.getExtension("WEBGL_debug_renderer_info");
          var name = ext ? String(strict.getParameter(ext.UNMASKED_RENDERER_WEBGL)).toLowerCase() : "";
          var lose = strict.getExtension("WEBGL_lose_context");
          if (lose) lose.loseContext();
          return /swiftshader|llvmpipe|software|basic render/.test(name);
        } catch (e) {
          return false;
        }
      }
      var softwareRendering = detectSoftwareRendering();
      if (softwareRendering) MAX_RENDER_WIDTH = 800;
      function fitCanvas() {
        var w = window.innerWidth, h = window.innerHeight;
        var aspect = Math.min(Math.max(w / h, MIN_ASPECT), MAX_ASPECT);
        if (w / h > aspect) w = h * aspect; else h = w / aspect;
        canvas.style.width = Math.floor(w) + "px";
        canvas.style.height = Math.floor(h) + "px";
        var scale = Math.min(1, MAX_RENDER_WIDTH / w);
        canvas.width = Math.max(1, Math.floor(w * scale));
        canvas.height = Math.max(1, Math.floor(h * scale));
      }
      window.addEventListener("resize", fitCanvas);
      fitCanvas();

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/42b5ed9b6ac7b0fdab543435dfee5132.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/7dd667f39f821936337219ead9851f1c.data.unityweb",
        frameworkUrl: buildUrl + "/920f339d620ce6295ad188e9563930c0.framework.js.unityweb",
        codeUrl: buildUrl + "/1159905f0dcb6c43da524ca480e0c610.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "NyangNyangCompany",
        productName: "NyangNyangSurvival_Ver.0.1.5",
        productVersion: "0.1.5",
        showBanner: unityShowBanner,
      };
      // 렌더링 해상도는 위 fitCanvas()가 canvas.width/height로 직접 정한다.
      config.matchWebGLToCanvasSize = false;

      if (softwareRendering) {
        var notice = document.querySelector("#unity-perf-notice");
        notice.style.display = "block";
        document.querySelector("#unity-perf-notice-close").onclick = function () { notice.style.display = "none"; };
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          var fullscreenButton = document.querySelector("#unity-fullscreen-button");
          fullscreenButton.style.display = "block";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
